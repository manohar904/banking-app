name: CI

on:
  push:
    branches: [main]
  pull_request:

# The pipeline only reads the code. Later jobs ask for more only where they need it.
permissions:
  contents: read

# A newer push to the same branch replaces a run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # Also runs the integration tests. GitHub's runners include the Docker they need.
      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7
