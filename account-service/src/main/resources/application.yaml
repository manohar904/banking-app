spring:
  application:
    name: account-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
      properties:
        # Give up quickly: these sends happen in the background and are tried again.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    # This service alone uses this database. The password has no default; see application-local.yaml.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bank_accounts}${DB_URL_OPTIONS:}
    username: ${DB_USERNAME:account_service}
    password: ${DB_PASSWORD}
  jpa:
    # Flyway owns the schema. Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

bank:
  audit:
    path: /api/accounts/audit
  services:
    customer-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
  transfers:
    # The most a customer may send by transfer in one day, over all their accounts. Staff have no limit.
    customer-daily-limit: ${CUSTOMER_DAILY_TRANSFER_LIMIT:1000.00}
    # The day starts at midnight here.
    time-zone: ${TRANSFER_LIMIT_TIMEZONE:UTC}
  loans:
    # Percent a year, fixed for each loan when it is asked for. Changing it doesn't change existing loans.
    annual-interest-rate: ${LOAN_ANNUAL_INTEREST_RATE:9.50}
    min-amount: 100.00
    max-amount: 50000.00
    min-months: 6
    max-months: 60
    auto-pay:
      # Monthly payments are taken from the loan's account when due. Every hour, at five past.
      enabled: true
      cron: "0 5 * * * *"
  cards:
    # The highest spending limit staff can give a card.
    max-limit: 20000.00
    # A purchase that takes what is owed to this percent of the limit emails the customer a warning.
    limit-warning-percent: ${CARD_LIMIT_WARNING_PERCENT:80}
    # Percent a year, charged monthly on the part of a statement not paid by the next one.
    annual-interest-rate: ${CARD_ANNUAL_INTEREST_RATE:19.90}
    # A statement's minimum payment: this percent of what is owed, but at least minimum-payment.
    minimum-payment-percent: 5
    minimum-payment: 25.00
    # Days after the statement that payment is due by.
    payment-days: 21
    statements:
      # A statement is made on the first of each month. Checked every hour, at a quarter past.
      enabled: true
      cron: "0 15 * * * *"
