spring:
  application:
    name: auth-service
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
      properties:
        # Give up quickly: these sends happen in the background and are tried again.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    # This service alone uses this database. The password has no default; see application-local.yaml.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bank_auth}
    username: ${DB_USERNAME:auth_service}
    password: ${DB_PASSWORD}
  jpa:
    # Flyway owns the schema. Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8083

management:
  health:
    mail:
      # A mail outage must not mark the service unhealthy: signing in does not need email.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

bank:
  password-reset:
    # Empty turns reset emails off. Links are built from base-url, never from the request.
    from: ${MAIL_FROM:}
    base-url: ${APP_BASE_URL:http://localhost:8080}
  sign-in:
    # Failed sign-ins allowed from one browser address in 15 minutes, over all emails. Each email also
    # has its own limit of 5 attempts.
    max-failures-per-address: ${SIGN_IN_MAX_FAILURES_PER_ADDRESS:20}
  audit:
    path: /api/auth/audit
  services:
    customer-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
  admin:
    # Creates the first staff login at startup if none exists. There is deliberately no default.
    email: ${BANK_ADMIN_EMAIL:}
    password: ${BANK_ADMIN_PASSWORD:}
