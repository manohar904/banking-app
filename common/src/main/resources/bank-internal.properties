# Where each part of the bank publishes the public key its internal tokens are signed with. A token
# is trusted only if one of these signed it, and a token for a person only if the gateway did.
# Every value can be overridden like any other setting.
#
# The gateway's main port also serves browsers, so in compose.yaml its keys come from its private
# management port instead, over HTTPS (GATEWAY_KEYS_URL).
bank.internal.issuers[gateway]=${GATEWAY_KEYS_URL:${GATEWAY_URL:http://localhost:8080}/.well-known/internal-jwks.json}
bank.internal.issuers[customer-service]=${CUSTOMER_SERVICE_URL:http://localhost:8081}/.well-known/internal-jwks.json
bank.internal.issuers[account-service]=${ACCOUNT_SERVICE_URL:http://localhost:8082}/.well-known/internal-jwks.json
bank.internal.issuers[auth-service]=${AUTH_SERVICE_URL:http://localhost:8083}/.well-known/internal-jwks.json
