# Where each part of the bank publishes the public key its internal tokens are signed with. A token
# is trusted only if one of these signed it, and a token for a person only if the gateway did.
# Every value can be overridden like any other setting.
bank.internal.issuers[gateway]=${GATEWAY_URL:http://localhost:8080}
bank.internal.issuers[customer-service]=${CUSTOMER_SERVICE_URL:http://localhost:8081}
bank.internal.issuers[account-service]=${ACCOUNT_SERVICE_URL:http://localhost:8082}
bank.internal.issuers[auth-service]=${AUTH_SERVICE_URL:http://localhost:8083}
