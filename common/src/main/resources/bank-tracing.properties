# Defaults for tracing in every service; see TracingConfig. Override like any other setting.

# Every request is traced. Lower this when there is a lot of traffic.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
# Prometheus scrapes the metrics, so they are not also pushed over OTLP.
management.otlp.metrics.export.enabled=false
# Spring Security's own spans add a dozen "filterchain" steps to every request, and become traces of
# their own for health checks. The request span already shows whether access was refused.
management.observations.enable.spring.security=false
