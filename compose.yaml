# Local development stack. The default database password is for local use only.
# Everything:     docker compose up -d --build
# Database only:  docker compose up -d postgres    (then .\gradlew.bat bootRun)
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-banking}
      POSTGRES_USER: ${DB_USERNAME:-bank}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bank_dev_password}
    ports:
      # Bound to localhost so the database is not reachable from the network.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep their data under /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-banking}
      DB_USERNAME: ${DB_USERNAME:-bank}
      DB_PASSWORD: ${DB_PASSWORD:-bank_dev_password}
      # Only used to create the first staff login, when none exists yet.
      BANK_ADMIN_EMAIL: ${BANK_ADMIN_EMAIL:-}
      BANK_ADMIN_PASSWORD: ${BANK_ADMIN_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/index.html"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    mem_limit: 768m

volumes:
  postgres-data:
