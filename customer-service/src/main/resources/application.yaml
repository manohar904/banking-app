spring:
  application:
    name: customer-service
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      # Latest: turning this on must not email people about transactions from before it existed.
      auto-offset-reset: latest
    producer:
      acks: all
      properties:
        # Give up quickly: these sends happen in the background and are tried again.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    # This service alone uses this database. The password has no default; see application-local.yaml.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bank_customers}
    username: ${DB_USERNAME:customer_service}
    password: ${DB_PASSWORD}
  jpa:
    # Flyway owns the schema. Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8081

management:
  health:
    mail:
      # A mail outage must not mark the service unhealthy: only these emails need it.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

bank:
  transaction-emails:
    # Empty turns transaction emails off for everyone.
    from: ${MAIL_FROM:}
  audit:
    path: /api/customers/audit
  services:
    account-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8083}
