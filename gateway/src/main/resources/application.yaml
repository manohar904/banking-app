spring:
  application:
    name: gateway
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      acks: all
      properties:
        # Give up quickly: these sends happen in the background and are tried again.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      # Fail fast: a request waits on Redis while it loads the session.
      connect-timeout: 2s
      timeout: 2s
  session:
    data:
      redis:
        namespace: bank:sessions
  task:
    scheduling:
      pool:
        size: 2

management:
  # A separate port, never published: the main port is open to anyone who can reach the bank.
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

server:
  port: 8080
  servlet:
    session:
      # Also how long a session is kept in Redis after its last use.
      timeout: 30m
      cookie:
        same-site: lax
        # Set SESSION_COOKIE_SECURE=true whenever the application is served over HTTPS.
        secure: ${SESSION_COOKIE_SECURE:false}

bank:
  internal:
    # Signs the tokens services use with each other. There is deliberately no default.
    token-secret: ${INTERNAL_TOKEN_SECRET}
  services:
    customer-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
    account-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8083}
