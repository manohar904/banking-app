spring:
  application:
    name: gateway

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        same-site: lax
        # Set SESSION_COOKIE_SECURE=true whenever the application is served over HTTPS.
        secure: ${SESSION_COOKIE_SECURE:false}

bank:
  internal:
    # Signs the tokens services use with each other. There is deliberately no default.
    token-secret: ${INTERNAL_TOKEN_SECRET}
  services:
    customer-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
    account-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8083}
