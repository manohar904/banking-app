apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Bank logs
    uid: bank-logs
    type: elasticsearch
    access: proxy
    url: https://elasticsearch:9200
    # A login that may only read the logs; see monitoring/setup-elasticsearch.sh.
    basicAuth: true
    basicAuthUser: grafana_bank
    secureJsonData:
      basicAuthPassword: $ELASTICSEARCH_PASSWORD
      # HTTPS, trusting only the stack's certificate authority.
      tlsCACert: $__file{/certs/ca/ca.crt}
    jsonData:
      tlsAuthWithCACert: true
      index: bank-logs-*
      timeField: "@timestamp"
  # Traces of requests across the services. "Logs for this span" opens the matching log lines.
  - name: Traces
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: bank-logs
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        customQuery: true
        query: 'traceId:"$${__trace.traceId}"'
