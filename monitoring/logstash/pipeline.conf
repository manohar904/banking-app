# Everything the bank puts on Kafka ends up in Elasticsearch, in one index per kind and per day.
input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["bank.events", "bank.health", "bank.logs"]
    group_id => "logstash"
    auto_offset_reset => "earliest"
    decorate_events => "basic"
    codec => "json"
    # Signs in as "logstash". The passwords here and below come from compose.yaml.
    security_protocol => "SASL_PLAINTEXT"
    sasl_mechanism => "PLAIN"
    sasl_jaas_config => 'org.apache.kafka.common.security.plain.PlainLoginModule required username="logstash" password="${KAFKA_PASSWORD}";'
  }
}

filter {
  mutate {
    add_field => { "[@metadata][topic]" => "%{[@metadata][kafka][topic]}" }
  }

  if [@metadata][topic] == "bank.logs" {
    mutate { add_field => { "[@metadata][kind]" => "logs" } }
    # The services log one JSON object per line. Anything else, like a crash, stays as plain text.
    if [message] =~ /^\s*\{/ {
      json {
        source => "message"
        skip_on_invalid_json => true
      }
    }
  } else if [@metadata][topic] == "bank.events" {
    mutate { add_field => { "[@metadata][kind]" => "events" } }
    date { match => ["occurredAt", "ISO8601"] }
  } else {
    mutate { add_field => { "[@metadata][kind]" => "health" } }
    date { match => ["checkedAt", "ISO8601"] }
  }
}

output {
  if [@metadata][kind] == "events" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      # May only write the bank-* indices; see monitoring/setup-elasticsearch.sh.
      user => "logstash_bank"
      password => "${ELASTICSEARCH_PASSWORD}"
      index => "bank-events-%{+YYYY.MM.dd}"
      # Kafka can deliver an event twice. With its own id as the key it is still stored once.
      document_id => "%{eventId}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      # May only write the bank-* indices; see monitoring/setup-elasticsearch.sh.
      user => "logstash_bank"
      password => "${ELASTICSEARCH_PASSWORD}"
      index => "bank-%{[@metadata][kind]}-%{+YYYY.MM.dd}"
    }
  }
}
