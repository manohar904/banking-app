groups:
  - name: bank
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} cannot be reached"
      - alert: KafkaDown
        expr: probe_success{job="kafka-probe"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka cannot be reached. Banking keeps working and events wait in the services' databases, but nothing reaches Kibana until it is back."
      - alert: ServiceUnhealthy
        expr: bank_health_status == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} reports itself unhealthy, usually because its database is unavailable"
      - alert: HighErrorRate
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (job) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests to {{ $labels.job }} are failing"
      - alert: EventsNotReachingKafka
        expr: bank_outbox_pending > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} has {{ $value }} events waiting. Is Kafka down?"
      - alert: ManyFailedSignIns
        expr: sum(increase(bank_signins_total{outcome="failure"}[5m])) > 20
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} failed sign-ins in 5 minutes"
