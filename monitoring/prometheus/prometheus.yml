global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Kafka can't report that it is down, so this checks from outside that each broker accepts connections.
  - job_name: kafka-probe
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["kafka-1:9092", "kafka-2:9092", "kafka-3:9092"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  # The apps answer HTTPS with certificates from the stack's own certificate authority.
  - job_name: gateway
    metrics_path: /actuator/prometheus
    scheme: https
    tls_config:
      ca_file: /certs/ca/ca.crt
    static_configs:
      - targets: ["gateway:8090"]
  - job_name: customer-service
    metrics_path: /actuator/prometheus
    scheme: https
    tls_config:
      ca_file: /certs/ca/ca.crt
    static_configs:
      - targets: ["customer-service:8081"]
  - job_name: account-service
    metrics_path: /actuator/prometheus
    scheme: https
    tls_config:
      ca_file: /certs/ca/ca.crt
    static_configs:
      - targets: ["account-service:8082"]
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    scheme: https
    tls_config:
      ca_file: /certs/ca/ca.crt
    static_configs:
      - targets: ["auth-service:8083"]
  - job_name: backup
    static_configs:
      - targets: ["backup:9188"]
