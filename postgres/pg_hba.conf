# Who may connect to PostgreSQL, and how. Used instead of the one in the data volume; see compose.yaml.
#
# Inside the postgres container itself (the health check, first-time set-up): as the image does.
local   all          all                    trust
host    all          all     127.0.0.1/32   trust
host    all          all     ::1/128        trust
local   replication  all                    trust

# Everyone else, over the network: only over TLS, and only with a password.
hostssl   all        all     all            scram-sha-256
hostnossl all        all     all            reject
